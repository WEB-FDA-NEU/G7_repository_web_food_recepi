<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Ladle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="login">

  <site-header class="site-header"></site-header>

  <main class="container">
    <div class="auth-shell">
      <h1 class="h1" style="font-size:var(--text-2xl);margin-bottom:var(--space-2);">Welcome back</h1>
      <p class="lede" style="margin-bottom:var(--space-6);">Sign in to save recipes and post your own.</p>

      <div class="alert alert--error" id="form-alert"></div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" minlength="4">
          <span class="field__hint">Demo only — any email works with a 4+ character password.</span>
        </div>
        <button class="btn btn--primary btn--full" type="submit">Sign in</button>
      </form>

      <p class="form-foot">New to Ladle? <a class="btn--text" href="register.html">Create an account</a></p>
    </div>
  </main>

  <site-footer class="site-footer"></site-footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render.js"></script>
  <script src="components/site-header.js"></script>
  <script src="components/site-footer.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
