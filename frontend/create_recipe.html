<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Share a recipe — Ladle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="create_recipe">
  <site-header class="site-header"></site-header>
  <main class="container">
    <div class="auth-shell">
      <h1 class="h1" style="font-size:var(--text-2xl);margin-bottom:var(--space-2);">Share a recipe</h1>
      <p class="lede" style="margin-bottom:var(--space-6);">Write down the recipe you’d share with a friend.</p>
      <div class="alert alert--error" id="form-alert" role="alert"></div>
      <form id="recipe-form">
        <div class="field"><label for="title">Recipe title</label><input id="title" name="title" required minlength="6" maxlength="160"></div>
        <div class="field"><label for="summary">Short description</label><textarea id="summary" name="summary" required minlength="20" rows="3"></textarea></div>
        <div class="field"><label for="category">Category</label><select id="category" name="category" required>
          <option value="breakfast">Breakfast</option><option value="mains">Mains</option><option value="salads">Salads</option><option value="soups">Soups</option><option value="baking">Baking</option><option value="desserts">Desserts</option>
        </select></div>
        <div class="field"><label for="minutes">Preparation time (minutes)</label><input type="number" id="minutes" name="minutes" min="1" max="600" value="30" required></div>
        <div class="field"><label for="servings">Servings</label><input type="number" id="servings" name="servings" min="1" max="50" value="4" required></div>
        <div class="field"><label for="difficulty">Difficulty</label><select id="difficulty" name="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
        <div class="field"><label for="tags">Tags</label><input id="tags" name="tags" placeholder="quick, vegetarian (comma separated)"></div>
        <div class="field"><label for="ingredients">Ingredients</label><textarea id="ingredients" name="ingredients" required rows="6" placeholder="2 cups | flour&#10;1 tsp | salt"></textarea><span class="field__hint">One ingredient per line, formatted as quantity | ingredient.</span></div>
        <div class="field"><label for="steps">Instructions</label><textarea id="steps" name="steps" required rows="7" placeholder="Mix the dry ingredients.&#10;Add the wet ingredients and stir."></textarea><span class="field__hint">Write one instruction step per line.</span></div>
        <div class="field"><label for="notes">Extra notes (optional)</label><textarea id="notes" name="notes" rows="3"></textarea></div>
        <button class="btn btn--primary btn--full" type="submit">Publish recipe</button>
      </form>
    </div>
  </main>
  <site-footer class="site-footer"></site-footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render.js"></script>
  <script src="components/site-header.js"></script>
  <script src="components/site-footer.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
