<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse recipes — Ladle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="list">

  <site-header class="site-header"></site-header>

  <main class="container section--tight section">
    <div class="section__head">
      <div>
        <h1 class="h1" style="font-size:var(--text-2xl);">Browse recipes</h1>
        <p class="lede" id="result-count"></p>
      </div>
      <label class="field" style="margin:0;min-width:260px;">
        <span class="field__hint">Search</span>
        <input type="search" id="search-input" placeholder="e.g. miso, noodles, galette">
      </label>
    </div>

    <div class="chip-row" id="category-chips" style="margin-bottom:var(--space-6);"></div>

    <div id="recipe-grid">
      <div class="recipe-grid">
        <div class="recipe-card">
          <div class="skeleton" style="aspect-ratio:4/3;border-radius:6px;"></div>
        </div>
      </div>
    </div>
  </main>

  <site-footer class="site-footer"></site-footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render.js"></script>
  <script src="components/site-header.js"></script>
  <script src="components/site-footer.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
